name: JinguiSSL Package CI

env:
  CANGJIE_SDK_NAME: cangjie-sdk-linux-x64-1.1.3
  CANGJIE_SDK_SHA256: 2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a
  CANGJIE_SDK_URL: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"

on:
  push:
    branches:
      - main
      - master
      - develop
      - "mr/**"
      - "ci/**"
      - "fix/**"
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-safety-audit:
    name: Fork-safe public audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect CI guard files on external pull requests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$BASE_SHA" -- .github/workflows/ci.yml scripts/jinguissl_ci_audit.sh scripts/jinguissl_capability_gate.py scripts/jinguissl_capability_gate_test.py scripts/jinguissl_pre_review.sh
      - name: Static public-surface audit
        run: bash scripts/jinguissl_ci_audit.sh public .
      - name: Capability and public-document gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/jinguissl_capability_gate.py --check --root . --base-ref "$BASE_SHA"
          else
            python3 scripts/jinguissl_capability_gate.py --check --root .
          fi
      - name: Capability gate regression tests
        run: python3 scripts/jinguissl_capability_gate_test.py

      - name: Consumer dependency and lock regression gate
        run: |
          python3 scripts/jinguissl_consumer_dependency_gate.py
          python3 scripts/jinguissl_consumer_dependency_gate_test.py

  package-build-test:
    name: Package build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: public-safety-audit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hosted dependency graph audit
        run: bash scripts/jinguissl_ci_audit.sh hosted-graph .

      - name: Validate dependency lock on merge and main
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        run: bash scripts/jinguissl_ci_audit.sh dependency-lock .

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: ~/.cangjie/${{ env.CANGJIE_SDK_NAME }}
          key: ${{ runner.os }}-${{ env.CANGJIE_SDK_NAME }}-${{ env.CANGJIE_SDK_SHA256 }}

      - name: Install Cangjie toolchain
        run: |
          mkdir -p "$HOME/.cangjie"
          sdk_root="$HOME/.cangjie/${CANGJIE_SDK_NAME}"
          archive="$RUNNER_TEMP/${CANGJIE_SDK_NAME}.tar.gz"
          if [ ! -x "$sdk_root/bin/cjc" ] || [ ! -x "$sdk_root/tools/bin/cjpm" ]; then
            curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "$CANGJIE_SDK_URL" -o "$archive"
            echo "${CANGJIE_SDK_SHA256}  $archive" | sha256sum -c -
            rm -rf "$sdk_root"
            mkdir -p "$sdk_root"
            tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          fi
          . "$sdk_root/envsetup.sh"
          echo "$CANGJIE_HOME/bin" >> "$GITHUB_PATH"
          echo "$CANGJIE_HOME/tools/bin" >> "$GITHUB_PATH"
          echo "CANGJIE_HOME=$CANGJIE_HOME" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Cache Cangjie packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cjpm
            ~/.cangjie/packages
            ~/.cache/cangjie
          key: ${{ runner.os }}-cangjie-${{ hashFiles('cjpm.toml', 'cjpm.lock') }}

      - name: Verify Cangjie toolchain
        run: |
          . "$CANGJIE_HOME/envsetup.sh"
          command -v cjc
          command -v cjpm
          cjc --version
          cjpm --version

      - name: Build
        run: |
          . "$CANGJIE_HOME/envsetup.sh"
          cjpm build

      - name: Test
        run: |
          . "$CANGJIE_HOME/envsetup.sh"
          cjpm test

      - name: Contract-only DTLS reference interoperability
        run: |
          . "$CANGJIE_HOME/envsetup.sh"
          (cd examples/dtls-consumer && cjpm build)
          python3 scripts/dtls_openssl_interop.py

      - name: Resolve the fixed Core reference-tool revision
        id: tlcp_core
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path('cjpm.lock').read_text()
          matches = re.findall(r'jinguissl_core\s*=\s*\{[^\n]*commitId\s*=\s*"([0-9a-f]{40})"', text)
          assert len(matches) == 1, 'TLCP review requires one fixed Core commit'
          print('sha=' + matches[0])
          PY

      - uses: actions/checkout@v4
        with:
          repository: Celading/jinguisslCore
          ref: ${{ steps.tlcp_core.outputs.sha }}
          path: .ci/tlcp-core
          persist-credentials: false

      - name: Contract-only TLCP reference interoperability
        run: |
          . "$CANGJIE_HOME/envsetup.sh"
          set -o pipefail
          mkdir -p target/tlcp-evidence
          reference="$RUNNER_TEMP/tlcp-reference"
          git init "$reference"
          git -C "$reference" remote add origin https://github.com/openHiTLS/openHiTLS.git
          git -C "$reference" fetch --depth=1 origin 586d8aa6e8581a23a202d107e0e2af8087c18829
          git -C "$reference" checkout --detach FETCH_HEAD
          bash .ci/tlcp-core/scripts/tlcp_build_reference.sh "$reference" 2>&1 | tee target/tlcp-evidence/reference-build.log
          (cd examples/tlcp-consumer && cjpm build -j1) 2>&1 | tee target/tlcp-evidence/consumer-build.log
          python3 .ci/tlcp-core/scripts/tlcp_openhitls_interop.py \
            --binary examples/tlcp-consumer/target/release/bin/main \
            --reference "$reference/build/tlcp-reference-peer" \
            --openssl openssl 2>&1 | tee target/tlcp-evidence/interop.log

      - name: Upload TLCP consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tlcp-contract-${{ github.sha }}
          path: target/tlcp-evidence
          if-no-files-found: warn

  application-consumer-smoke:
    name: Standalone application consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: package-build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: ~/.cangjie/${{ env.CANGJIE_SDK_NAME }}
          key: ${{ runner.os }}-${{ env.CANGJIE_SDK_NAME }}-${{ env.CANGJIE_SDK_SHA256 }}

      - name: Install Cangjie toolchain
        run: |
          mkdir -p "$HOME/.cangjie"
          sdk_root="$HOME/.cangjie/${CANGJIE_SDK_NAME}"
          archive="$RUNNER_TEMP/${CANGJIE_SDK_NAME}.tar.gz"
          if [ ! -x "$sdk_root/bin/cjc" ] || [ ! -x "$sdk_root/tools/bin/cjpm" ]; then
            curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "$CANGJIE_SDK_URL" -o "$archive"
            echo "${CANGJIE_SDK_SHA256}  $archive" | sha256sum -c -
            rm -rf "$sdk_root"
            mkdir -p "$sdk_root"
            tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          fi
          . "$sdk_root/envsetup.sh"
          echo "$CANGJIE_HOME/bin" >> "$GITHUB_PATH"
          echo "$CANGJIE_HOME/tools/bin" >> "$GITHUB_PATH"
          echo "CANGJIE_HOME=$CANGJIE_HOME" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Cache Cangjie packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cjpm
            ~/.cangjie/packages
            ~/.cache/cangjie
          key: ${{ runner.os }}-cangjie-consumer-${{ hashFiles('cjpm.toml', 'cjpm.lock', 'examples/contract-application-smoke/cjpm.toml', 'examples/contract-application-smoke/cjpm.lock') }}

      - name: Build standalone application
        working-directory: examples/contract-application-smoke
        run: |
          . "$CANGJIE_HOME/envsetup.sh"
          cjpm build

      - name: Run standalone application
        working-directory: examples/contract-application-smoke
        run: |
          . "$CANGJIE_HOME/envsetup.sh"
          cjpm run

      - name: Direct-Contract consumer smokes and lock parity
        run: bash scripts/jinguissl_consumer_smokes.sh

      - name: Independent TLS and raw QUIC handshake references
        run: |
          reference_env="$RUNNER_TEMP/jinguissl-handshake-reference"
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Reference tests require Python >= 3.10"'
          python3 -m venv "$reference_env"
          "$reference_env/bin/python" -m pip install "aioquic==1.3.0"
          "$reference_env/bin/python" scripts/tls_client_openssl_smoke.py
          "$reference_env/bin/python" scripts/tls_client_certificate_request_smoke.py
          "$reference_env/bin/python" scripts/tls_server_openssl_smoke.py
          "$reference_env/bin/python" scripts/quic_handshake_aioquic_smoke.py
