[package]
  cjc-version = "1.0.0"
  version = "0.7.5"
  name = "jinguissl"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = "Apache-2.0"
  description = "Stable Cangjie facade for cryptography, X.509, TLS, and SSH startup contracts"
  include = ["src"]

[dependencies]
  jinguissl_core = { git = "https://github.com/Celading/jinguisslCore.git" }
