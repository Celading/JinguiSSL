[package]
  cjc-version = "1.0.0"
  version = "0.8.0"
  name = "jinguissl"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = ["Apache-2.0"]
  description = "Cangjie application facade for cryptography, X.509, TLS, SSH, and QUIC contracts"
  include = ["src", "docs", "LICENSE"]
  exclude = ["src/tests", "examples", "sample", "scripts", "testdata", ".github", "**/*_test.cj", "cangjie-repo.toml", ".env", ".env.*", "*.cjp"]

[dependencies]
  # Review source pin; not a registry release of the new TLCP provider.
  jinguissl_core = { git = "https://github.com/Celading/jinguisslCore.git", commitId = "bcea69d8e23631a1d65938b1f6ec46d7c0ce156b" }
