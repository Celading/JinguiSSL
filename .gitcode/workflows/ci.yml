name: JinguiSSL Contract CI

env:
  CANGJIE_SDK_NAME: cangjie-sdk-linux-x64-1.1.3
  CANGJIE_SDK_SHA256: 2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a
  CANGJIE_SDK_URL: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"

on:
  push:
    branches:
      - main
      - master
      - develop
      - "mr/**"
      - "ci/**"
      - "fix/**"
  pull_request:
    types:
      - open
      - reopen
      - update
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  repository: read

jobs:
  contract-pre-review:
    name: Audit, build, test and standalone consumer
    runs-on: euleros-2.10.1
    timeout-minutes: 45
    defaults:
      run:
        working-directory: repo_workspace
    steps:
      - name: Checkout source
        uses: checkout-action@0.0.1

      - name: Install Cangjie toolchain
        run: |
          set -euo pipefail
          runtime_root="$PWD/.ci-runtime"
          sdk_root="$runtime_root/${CANGJIE_SDK_NAME}"
          archive="$runtime_root/${CANGJIE_SDK_NAME}.tar.gz"
          mkdir -p "$sdk_root"
          curl -fL --retry 4 --connect-timeout 20 "$CANGJIE_SDK_URL" -o "$archive"
          echo "${CANGJIE_SDK_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          test -x "$sdk_root/bin/cjc"
          test -x "$sdk_root/tools/bin/cjpm"

      - name: Verify toolchain and run full pre-review
        run: |
          set -euo pipefail
          . "$PWD/.ci-runtime/${CANGJIE_SDK_NAME}/envsetup.sh"
          cjc --version
          cjpm --version
          bash scripts/jinguissl_pre_review.sh

      - name: Independent TLS and raw QUIC handshake references
        run: |
          set -euo pipefail
          . "$PWD/.ci-runtime/${CANGJIE_SDK_NAME}/envsetup.sh"
          reference_env="$PWD/.ci-runtime/handshake-reference"
          reference_python=""
          for candidate in python3.14 python3.13 python3.12 python3.11 python3.10 python3; do
            if command -v "$candidate" >/dev/null && "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
              reference_python="$candidate"
              break
            fi
          done
          if [ -z "$reference_python" ]; then
            echo "Reference tests require Python >= 3.10 with venv; configure the runner. Tests are not skipped." >&2
            exit 1
          fi
          "$reference_python" -m venv "$reference_env"
          "$reference_env/bin/python" -m pip install "aioquic==1.3.0"
          "$reference_env/bin/python" scripts/tls_client_openssl_smoke.py
          "$reference_env/bin/python" scripts/quic_handshake_aioquic_smoke.py
